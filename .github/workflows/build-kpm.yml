name: Build SukiSU kernelsu.ko with KPM
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        default: 'android12-5.10'
        type: string

jobs:
  build-kpm:
    name: Build CONFIG_KPM=y for KMI
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android12-5.10-20260828
      options: --privileged

    steps:
    - name: Checkout source code
      uses: actions/checkout@v6

    - name: Build kernelsu.ko with KPM enabled
      run: |
        git config --global --add safe.directory /__w/sukisu-kpm-build/sukisu-kpm-build
        cd kernel
        MODPOST=/opt/ddk/src/android12-5.10/scripts/mod/modpost.c
        echo "=== Restore modpost check_exports (src tree) ==="
        sed -i 's,//		check_exports(mod);,		check_exports(mod);,' "$MODPOST" || true
        echo skip-restore-tolerance
        sed -i "s/^static void __attribute__((unused)) check_exports(/static void check_exports(/" "$MODPOST" || true
        grep -n "check_exports(mod);" "$MODPOST" || true
        rm -f /opt/ddk/kdir/android12-5.10/scripts/mod/modpost
        touch "$MODPOST"
        make -C /opt/ddk/src/android12-5.10 O=/opt/ddk/kdir/android12-5.10 scripts/mod/modpost 2>&1 || true
        echo "=== Building kernelsu.ko (KPM=y) ==="
        CONFIG_KSU=m CONFIG_KPM=y CC=clang make
        echo "=== Build completed ==="
        OUT_DIR=/github/workspace/out
        mkdir -p $OUT_DIR
        cp kernelsu.ko "$OUT_DIR/android12-5.10_kernelsu_kpm.ko"
        ls -la "$OUT_DIR"
        nm kernelsu.ko 2>/dev/null | grep -c kpm || true
        strings kernelsu.ko | grep -m 3 -i kpm || true

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: kernelsu-kpm-android12-5.10
        path: /github/workspace/out/android12-5.10_kernelsu_kpm.ko
