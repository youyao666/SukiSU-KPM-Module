name: Build SukiSU kernelsu.ko with KPM
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-kpm:
    name: KPM ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged

    steps:
    - name: Checkout source code
      uses: actions/checkout@v6

    - name: Build kernelsu.ko with KPM enabled
      run: |
        KMI=${{ matrix.kmi }}
        WS=${{ github.workspace }}
        git config --global --add safe.directory "$WS"
        cd kernel
        SRC=/opt/ddk/src/$KMI
        KDIR=/opt/ddk/kdir/$KMI
        MODPOST=$SRC/scripts/mod/modpost.c

        echo "=== Restore modpost check_exports (src tree: $KMI) ==="
        sed -i 's,//		check_exports(mod);,		check_exports(mod);,' "$MODPOST" || true
        sed -i 's,//		s->module = exp->module;,		s->module = exp->module;,' "$MODPOST" || true
        sed -i "s/^static void __attribute__((unused)) check_exports(/static void check_exports(/" "$MODPOST" || true
        if ! grep -q "check_exports(mod);" "$MODPOST"; then
          echo "::error::modpost patch pattern not found - ddk image layout changed for $KMI"; exit 1
        fi

        rm -f "$KDIR/scripts/mod/modpost"
        touch "$MODPOST"
        gcc -O2 -c -I"$SRC/scripts/mod" -I"$SRC/scripts/include" -I"$KDIR/scripts/mod" -Dmain=file2alias_main "$SRC/scripts/mod/file2alias.c" -o /tmp/file2alias.o || true
        # 6.6+ splits modpost (symcheck.c); whitelist only known-safe extras
        MODS="$SRC/scripts/mod"
        SRCS=""
        for extra in symcheck.c symsearch.c; do
          [ -f "$MODS/$extra" ] && SRCS="$SRCS $MODS/$extra"
        done
        echo "modpost sources: modpost.c sumversion.c$SRCS"
        gcc -O2 -I"$SRC/scripts/mod" -I"$SRC/scripts/include" -I"$KDIR/scripts/mod" -o "$KDIR/scripts/mod/modpost" "$MODPOST" "$MODS/sumversion.c" $SRCS /tmp/file2alias.o || true
        if [ ! -x "$KDIR/scripts/mod/modpost" ]; then
          echo "::error::modpost rebuild failed for $KMI"; exit 1
        fi

        echo "=== Building kernelsu.ko (KPM=y, $KMI) ==="
        CONFIG_KSU=m CONFIG_KPM=y KBUILD_MODPOST_WARN=1 CC=clang make
        echo "=== Build completed ==="

        echo "=== Sanity: __versions must be non-empty (MODVERSIONS kernels reject empty CRC tables) ==="
        if ! readelf -SW kernelsu.ko | grep -q __versions; then
          echo "::error::no __versions section - module will fail to load on MODVERSIONS kernels"; exit 1
        fi

        echo "=== UND symbols (should be kernel-exported only, no do_kpm/sukisu_*) ==="
        readelf -sW kernelsu.ko 2>/dev/null | awk '$7=="UND" && $8!="" {print $8}' | sort -u | tee /tmp/und.txt | head -50
        if grep -qE '^(do_kpm|sukisu_handle_kpm|sukisu_kpm_|sukisu_compact_)' /tmp/und.txt; then
          echo "::error::kpm symbols still UND - link incomplete"; exit 1
        fi
        if ! nm kernelsu.ko 2>/dev/null | grep -qE 'T sukisu_kpm_load_module_path'; then
          echo "::error::kpm.o not linked"; exit 1
        fi

        OUT_DIR="$WS/out"
        mkdir -p "$OUT_DIR"
        cp kernelsu.ko "$OUT_DIR/${KMI}_kernelsu_kpm.ko"
        ls -la "$OUT_DIR"

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: kernelsu-kpm-${{ matrix.kmi }}
        path: ${{ github.workspace }}/out/${{ matrix.kmi }}_kernelsu_kpm.ko
